:root[data-theme="light"] {

  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 12px; background: var(--page); color: var(--ink-1);
  display: flex; height: 100vh; overflow: hidden;

}

input[type="radio"],input[type="checkbox"] {
  accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }

<div id="content">
  <div id="topbar">
    <h1>Psychometric Curves — Study 2</h1>
    <div class="tabs">
      <button class="tab active" data-tab="ind">Individual panels</button>
      <button class="tab" data-tab="grow">Combined — Grow</button>
      <button class="tab" data-tab="shrink">Combined — Shrink</button>

  <div id="wrap"><canvas id="chart"></canvas></div>

<div id="tip"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
// Group-level proportions (all 12 participants), bell curve fit: P(x) = pk·exp(−(x−pse)²/(2w²))
// X axis: visual speed multiplier (%), veridical = 100%
const XOBS = [25, 50, 75, 100, 200, 300, 400];
const XMIN = 10, XMAX = 430;

const GROW = [
  { ps: 10, dir: 'Grow',   pse: 146.2, w: 170.0, pk: 0.962, y: [0.775,0.825,0.825,0.925,0.975,0.575,0.35 ] },
  { ps: 20, dir: 'Grow',   pse: 147.2, w: 159.3, pk: 0.971, y: [0.725,0.85, 0.8,  0.95, 0.95, 0.575,0.3  ] },
  { ps: 30, dir: 'Grow',   pse: 157.7, w: 174.1, pk: 0.939, y: [0.667,0.8,  0.9,  0.85, 0.875,0.725,0.325] },
  { ps: 40, dir: 'Grow',   pse: 147.1, w: 198.7, pk: 0.872, y: [0.7,  0.775,0.825,0.875,0.825,0.641,0.4  ] },
];
const SHRINK = [
  { ps: 10, dir: 'Shrink', pse: 128.3, w: 104.1, pk: 0.908, y: [0.5,  0.725,0.775,0.925,0.675,0.25, 0.125] },
  { ps: 20, dir: 'Shrink', pse: 120.4, w: 105.9, pk: 0.933, y: [0.6,  0.75, 0.85, 0.95, 0.675,0.225,0.125] },
  { ps: 30, dir: 'Shrink', pse: 129.3, w:  96.8, pk: 0.964, y: [0.525,0.675,0.85, 0.925,0.725,0.2,  0.125] },
  { ps: 40, dir: 'Shrink', pse: 117.8, w:  95.5, pk: 0.982, y: [0.575,0.8,  0.9,  0.95, 0.675,0.15, 0.125] },
];

// Interleaved for 2-col individual layout: [G10, S10, G20, S20, G30, S30, G40, S40]
const ALL_PANELS = [GROW[0],SHRINK[0],GROW[1],SHRINK[1],GROW[2],SHRINK[2],GROW[3],SHRINK[3]];

function bell(x, pse, w, pk) {
  return pk * Math.exp(-Math.pow(x - pse, 2) / (2 * w * w));
}

[...GROW, ...SHRINK].forEach(c => {
  c.xf = []; c.yf = [];
  for (let i = 0; i < 200; i++) {
    const x = XMIN + (XMAX - XMIN) * i / 199;
    c.xf.push(x);
    c.yf.push(bell(x, c.pse, c.w, c.pk));
  }
});

// ── COLOR SCHEMES ─────────────────────────────────────────────────────────────
const CAT_L = ['#2a78d6','#eb6834','#1baf7a','#eda100'];
const CAT_D = ['#3987e5','#d95926','#199e70','#c98500'];
const MONO_L = ['#1a1a18','#3a3a38','#5a5a58','#7a7a78'];
const MONO_D = ['#f5f5f4','#c3c2b7','#a0a09c','#808080'];
const DASHES = [[], [7,3], [2,3], [7,3,2,3]];

function isDark() {
  const t = document.documentElement.dataset.theme;
  if (t === 'dark') return true; if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function getColors() {
  const d = isDark(), sc = S.color;
  if (sc === 'cat')  return d ? CAT_D : CAT_L;
  if (sc === 'mono') return d ? MONO_D : MONO_L;
  return Array(4).fill(d ? '#3987e5' : '#2a78d6');
}
function getDash(i) { return S.color === 'mono' ? DASHES[i] : []; }

// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
  tab: 'ind', color: 'pub', pts: true, pse: true, thr: false, band: true, verid: false,
  thresh: 0.50, lw: 2.5, mk: 'circle', ms: 4, grid: 'major',
  fontTitle: 16, fontLabel: 14, fontTick: 14,
};

let hits = [];

// ── CANVAS ────────────────────────────────────────────────────────────────────
const C = document.getElementById('chart');
let ctx, dpr;

function initCanvas(cssW, cssH) {
  dpr = window.devicePixelRatio || 1;
  C.width = cssW * dpr; C.height = cssH * dpr;
  C.style.width = cssW + 'px'; C.style.height = cssH + 'px';
  ctx = C.getContext('2d'); ctx.scale(dpr, dpr);
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function marker(cx, cy, style, r, fill, ring) {
  ctx.save(); ctx.fillStyle = fill; ctx.strokeStyle = ring; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (style === 'circle') ctx.arc(cx, cy, r, 0, Math.PI * 2);
  else if (style === 'diamond') {
    const h = r * 1.35;
    ctx.moveTo(cx, cy-h); ctx.lineTo(cx+r, cy); ctx.lineTo(cx, cy+h); ctx.lineTo(cx-r, cy); ctx.closePath();
  } else if (style === 'square') ctx.rect(cx-r, cy-r, r*2, r*2);
  ctx.fill(); ctx.stroke(); ctx.restore();
}

function panelCoords(px, py, pw, ph, padT, padR, padB, padL) {
  const l = px+padL, r = px+pw-padR, t = py+padT, b = py+ph-padB;
  return {
    l, r, t, b, w: r-l, h: b-t,
    mX: x  => l + (x - XMIN) / (XMAX - XMIN) * (r - l),
    mY: yv => b - yv * (b - t),
  };
}

function drawPanelGrid(p, gridColor) {
  if (S.grid === 'none') return;
  ctx.save(); ctx.strokeStyle = gridColor; ctx.lineWidth = 0.5; ctx.setLineDash([]);
  [0, .25, .5, .75, 1].forEach(yv => {
    ctx.beginPath(); ctx.moveTo(p.l, p.mY(yv)); ctx.lineTo(p.r, p.mY(yv)); ctx.stroke();
  });
  if (S.grid === 'full') {
    [50,100,200,300,400].forEach(x => {
      ctx.beginPath(); ctx.moveTo(p.mX(x), p.t); ctx.lineTo(p.mX(x), p.b); ctx.stroke();
    });
  }
  ctx.restore();
}

function drawAxesTicks(p, axColor, textColor, showY) {
  const fs = S.fontTick;
  ctx.save(); ctx.strokeStyle = axColor; ctx.lineWidth = 1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(p.l,p.b); ctx.lineTo(p.r,p.b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.l,p.t); ctx.lineTo(p.l,p.b); ctx.stroke();
  ctx.fillStyle = textColor; ctx.font = `${fs}px system-ui, sans-serif`; ctx.textAlign = 'center';
  [50,100,200,300,400].forEach(x => {
    const tx = p.mX(x);
    ctx.beginPath(); ctx.moveTo(tx,p.b); ctx.lineTo(tx,p.b+3); ctx.stroke();
    ctx.fillText(x, tx, p.b+fs+1);
  });
  if (showY !== false) {
    ctx.textAlign = 'right';
    [0, .25, .5, .75, 1].forEach(yv => {
      const ty = p.mY(yv);
      ctx.beginPath(); ctx.moveTo(p.l-3,ty); ctx.lineTo(p.l,ty); ctx.stroke();
      ctx.fillText(yv.toFixed(2), p.l-5, ty+fs*0.35);
    });
  }
  ctx.restore();
}

// ── PANEL RENDERER ────────────────────────────────────────────────────────────
function drawPanel(c, colorIdx, px, py, pw, ph, colors, showY) {
  const dark = isDark();
  const surf  = dark ? '#1a1a19' : '#ffffff';
  const ink1  = dark ? '#f5f5f4' : '#0d0d0b';
  const inkM  = '#898781';
  const gridC = dark ? '#2c2c2a' : '#ddddd8';
  const axC   = dark ? '#383835' : '#c0bfba';
  const col   = colors[colorIdx];
  const dash  = getDash(colorIdx);

  const PAD = { t: 40, r: 10, b: 26, l: showY ? 40 : 8 };
  const p = panelCoords(px, py, pw, ph, PAD.t, PAD.r, PAD.b, PAD.l);

  ctx.fillStyle = surf; ctx.fillRect(px, py, pw, ph);
  ctx.save(); ctx.beginPath(); ctx.rect(p.l, p.t, p.w, p.h); ctx.clip();

  drawPanelGrid(p, gridC);

  if (S.thr) {
    ctx.strokeStyle = inkM; ctx.lineWidth = 0.75; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(p.l, p.mY(S.thresh)); ctx.lineTo(p.r, p.mY(S.thresh)); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (S.verid) {
    const vx = p.mX(100);
    ctx.strokeStyle = inkM; ctx.lineWidth = 0.75; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.moveTo(vx, p.t); ctx.lineTo(vx, p.b); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (S.band) {
    const above = c.xf.filter((x,i) => c.yf[i] >= S.thresh);
    if (above.length) {
      const bL = p.mX(Math.min(...above)), bR = p.mX(Math.max(...above));
      ctx.fillStyle = col + '28'; ctx.fillRect(bL, p.t, bR-bL, p.h);
    }
  }

  ctx.strokeStyle = col; ctx.lineWidth = S.lw; ctx.setLineDash(dash);
  ctx.beginPath();
  c.xf.forEach((x,i) => { const cx=p.mX(x),cy=p.mY(c.yf[i]); i===0?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy); });
  ctx.stroke(); ctx.setLineDash([]);

  if (S.pse) {
    ctx.strokeStyle = col; ctx.lineWidth = 0.85; ctx.globalAlpha = 0.65;
    ctx.beginPath(); ctx.moveTo(p.mX(c.pse),p.t); ctx.lineTo(p.mX(c.pse),p.b); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (S.pts) {
    XOBS.forEach((x,i) => {
      const cx=p.mX(x), cy=p.mY(c.y[i]);
      marker(cx, cy, S.mk, S.ms, col, surf);
      hits.push({ canvX:cx, canvY:cy, info:`${c.dir} · ps=${c.ps}mm · vs=${x}% → P=${c.y[i].toFixed(3)}` });
    });
  }

  ctx.restore();
  drawAxesTicks(p, axC, ink1, showY);

  ctx.fillStyle = ink1; ctx.font = `bold ${S.fontTitle}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(`Physical Speed: ${c.ps} mm`, p.l + 3, py + 13);

  if (S.pse) {
    const psX = p.mX(c.pse);
    if (psX >= p.l && psX <= p.r) {
      ctx.fillStyle = ink1; ctx.font = `${S.fontTick}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`PSE = ${c.pse.toFixed(1)} %`, psX, p.t - 3);
    }
  }
}

// ── INDIVIDUAL VIEW ───────────────────────────────────────────────────────────
function drawIndividual() {
  const cols = 2, rows = 4;
  const CW = 310, CH = 190;
  const GAP = 12, OUTER = 10;
  const HEADER = 28, YLABEL_W = 30, XLABEL_H = 22;
  const W = YLABEL_W + OUTER + CW*cols + GAP*(cols-1) + OUTER;
  const H = HEADER + OUTER + CH*rows + GAP*(rows-1) + OUTER + XLABEL_H;

  initCanvas(W, H); hits = [];

  const dark = isDark();
  const ink1 = dark ? '#f5f5f4' : '#0d0d0b';
  ctx.fillStyle = dark ? '#111114' : '#ffffff'; ctx.fillRect(0, 0, W, H);

  const colors = getColors();
  const panelsTop = HEADER + OUTER, panelsLeft = YLABEL_W + OUTER;

  // Column headers
  ctx.fillStyle = ink1; ctx.font = `bold ${S.fontTitle}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('Grow',   panelsLeft + CW/2,                   HEADER/2 + S.fontTitle*0.35);
  ctx.fillText('Shrink', panelsLeft + CW + GAP + CW/2,        HEADER/2 + S.fontTitle*0.35);

  ALL_PANELS.forEach((c, idx) => {
    const col = idx % cols, row = Math.floor(idx / cols);
    const px = panelsLeft + col*(CW+GAP), py = panelsTop + row*(CH+GAP);
    // same color per physical speed (row)
    drawPanel(c, row, px, py, CW, CH, colors, col === 0);
  });

  // Y-axis label
  const panelsH = CH*rows + GAP*(rows-1);
  ctx.save();
  ctx.translate(YLABEL_W/2, panelsTop + panelsH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle = ink1; ctx.font = `${S.fontLabel}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('P(congruent)', 0, 0); ctx.restore();

  // X-axis label
  const panelsW = CW*cols + GAP*(cols-1);
  ctx.fillStyle = ink1; ctx.font = `${S.fontLabel}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('Visual speed multiplier (%)', panelsLeft + panelsW/2, H - 5);

  if (S.band) {
    const col0 = getColors()[0];
    const txt = `P ≥ ${S.thresh}`;
    ctx.font = `${S.fontTick}px system-ui, sans-serif`;
    const txtW = ctx.measureText(txt).width;
    const lx = W - OUTER, ly = H - 5;
    ctx.fillStyle = col0 + '28'; ctx.fillRect(lx-txtW-14, ly-S.fontTick+2, 12, S.fontTick-1);
    ctx.fillStyle = ink1; ctx.textAlign = 'right'; ctx.fillText(txt, lx, ly);
  }
}

// ── COMBINED VIEW ─────────────────────────────────────────────────────────────
function drawCombined(curves, dirLabel) {
  const W = 740, H = 470;
  initCanvas(W, H); hits = [];

  const dark = isDark();
  const surf  = dark ? '#1a1a19' : '#ffffff';
  const ink1  = dark ? '#f5f5f4' : '#0d0d0b';
  const inkM  = '#898781';
  const gridC = dark ? '#2c2c2a' : '#ddddd8';
  const axC   = dark ? '#383835' : '#c0bfba';
  const colors = getColors();

  ctx.fillStyle = surf; ctx.fillRect(0, 0, W, H);

  const PAD = { t: 24, r: 160, b: 52, l: 54 };
  const l=PAD.l, r=W-PAD.r, t=PAD.t, b=H-PAD.b;
  const pw=r-l, ph=b-t;
  const mX = x  => l + (x - XMIN) / (XMAX - XMIN) * pw;
  const mY = yv => b - yv * ph;

  ctx.save(); ctx.beginPath(); ctx.rect(l,t,pw,ph); ctx.clip();

  if (S.grid !== 'none') {
    ctx.strokeStyle = gridC; ctx.lineWidth = 0.5; ctx.setLineDash([]);
    const yG = S.grid==='full' ? [0,.25,.5,.75,1] : [0,.5,1];
    yG.forEach(yv => { ctx.beginPath(); ctx.moveTo(l,mY(yv)); ctx.lineTo(r,mY(yv)); ctx.stroke(); });
    if (S.grid==='full') {
      [50,100,200,300,400].forEach(x => { ctx.beginPath(); ctx.moveTo(mX(x),t); ctx.lineTo(mX(x),b); ctx.stroke(); });
    }
  }

  if (S.thr) {
    const ty=mY(S.thresh); ctx.strokeStyle=inkM; ctx.lineWidth=0.8; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(l,ty); ctx.lineTo(r,ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=ink1; ctx.font=`${S.fontTick}px system-ui, sans-serif`; ctx.textAlign='left';
    ctx.fillText(`P = ${S.thresh}`, l+4, ty-4);
  }

  if (S.verid) {
    const vx=mX(100); ctx.strokeStyle=inkM; ctx.lineWidth=0.8; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(vx,t); ctx.lineTo(vx,b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=inkM; ctx.font=`${S.fontTick}px system-ui, sans-serif`; ctx.textAlign='center';
    ctx.fillText('100%', vx, t-4);
  }

  if (S.band) {
    curves.forEach((c,i) => {
      const above = c.xf.filter((x,j) => c.yf[j] >= S.thresh);
      if (above.length) {
        ctx.fillStyle = colors[i]+'22';
        ctx.fillRect(mX(Math.min(...above)), t, mX(Math.max(...above))-mX(Math.min(...above)), ph);
      }
    });
  }

  curves.forEach((c,i) => {
    ctx.strokeStyle=colors[i]; ctx.lineWidth=S.lw; ctx.setLineDash(getDash(i));
    ctx.beginPath();
    c.xf.forEach((x,j) => { const cx=mX(x),cy=mY(c.yf[j]); j===0?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy); });
    ctx.stroke(); ctx.setLineDash([]);
  });

  if (S.pse) {
    curves.forEach((c,i) => {
      ctx.strokeStyle=colors[i]; ctx.lineWidth=0.85; ctx.globalAlpha=0.6; ctx.setLineDash([3,2]);
      ctx.beginPath(); ctx.moveTo(mX(c.pse),t); ctx.lineTo(mX(c.pse),b); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    });
  }

  if (S.pts) {
    curves.forEach((c,i) => {
      XOBS.forEach((x,j) => {
        const cx=mX(x), cy=mY(c.y[j]);
        marker(cx, cy, S.mk, S.ms, colors[i], surf);
        hits.push({ canvX:cx, canvY:cy, info:`${c.dir} · ps=${c.ps}mm · vs=${x}% → P=${c.y[j].toFixed(3)}` });
      });
    });
  }

  ctx.restore();

  ctx.strokeStyle=axC; ctx.lineWidth=1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(l,b); ctx.lineTo(r,b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(l,t); ctx.lineTo(l,b); ctx.stroke();

  ctx.fillStyle=ink1; ctx.font=`${S.fontTick}px system-ui, sans-serif`; ctx.textAlign='center';
  [25,50,100,150,200,300,400].forEach(x => {
    const tx=mX(x);
    if (tx < l-2 || tx > r+2) return;
    ctx.beginPath(); ctx.moveTo(tx,b); ctx.lineTo(tx,b+4); ctx.stroke();
    ctx.fillText(x, tx, b+S.fontTick+4);
  });
  ctx.textAlign='right';
  [0,.25,.5,.75,1].forEach(yv => {
    const ty=mY(yv);
    ctx.beginPath(); ctx.moveTo(l-4,ty); ctx.lineTo(l,ty); ctx.stroke();
    ctx.fillText(yv.toFixed(2), l-6, ty+S.fontTick*0.35);
  });

  ctx.fillStyle=ink1; ctx.font=`${S.fontLabel}px system-ui, sans-serif`; ctx.textAlign='center';
  ctx.fillText('Visual speed multiplier (%)', l+pw/2, H-10);
  ctx.save(); ctx.translate(13, t+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('P(congruent)', 0, 0); ctx.restore();

  const LX=r+16; let LY=t+16;
  curves.forEach((c,i) => {
    const lc=colors[i];
    ctx.strokeStyle=lc; ctx.lineWidth=S.lw; ctx.setLineDash(getDash(i));
    ctx.beginPath(); ctx.moveTo(LX,LY); ctx.lineTo(LX+22,LY); ctx.stroke(); ctx.setLineDash([]);
    if (S.pts) marker(LX+11, LY, S.mk, Math.min(S.ms,4), lc, surf);
    ctx.fillStyle=ink1; ctx.font=`${S.fontLabel}px system-ui, sans-serif`; ctx.textAlign='left';
    ctx.fillText(`ps = ${c.ps} mm`, LX+27, LY+4);
    if (S.pse) {
      ctx.fillStyle=ink1; ctx.font=`${S.fontTick}px system-ui, sans-serif`;
      ctx.fillText(`PSE = ${c.pse.toFixed(1)} %`, LX+27, LY+S.fontTick+3);
    }
    LY += S.pse ? S.fontLabel+18 : S.fontLabel+10;
  });

  ctx.fillStyle=ink1; ctx.font=`bold ${S.fontTitle}px system-ui, sans-serif`; ctx.textAlign='left';
  ctx.fillText(`${dirLabel} — all physical speeds`, l, t+S.fontTitle+2);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  if (S.tab==='ind') drawIndividual();
  else if (S.tab==='grow') drawCombined(GROW, 'Grow');
  else drawCombined(SHRINK, 'Shrink');
}

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const tip = document.getElementById('tip');
C.addEventListener('mousemove', e => {
  const rect=C.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const R2=(S.ms+5)*(S.ms+5);
  let found=null;
  for (const h of hits) { const dx=mx-h.canvX,dy=my-h.canvY; if(dx*dx+dy*dy<R2){found=h;break;} }
  if (found) {
    tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.textContent=found.info;
  } else tip.style.display='none';
});
C.addEventListener('mouseleave', () => { tip.style.display='none'; });

// ── CONTROLS ──────────────────────────────────────────────────────────────────
document.querySelectorAll('input[name="color"]').forEach(el =>
  el.addEventListener('change', e => { S.color=e.target.value; render(); }));
['chkPts','chkPSE','chkThr','chkBand','chkVer'].forEach((id,i) => {
  const keys=['pts','pse','thr','band','verid'];
  document.getElementById(id).addEventListener('change', e => { S[keys[i]]=e.target.checked; render(); });
});
document.querySelectorAll('input[name="thr"]').forEach(el =>
  el.addEventListener('change', e => { S.thresh=parseFloat(e.target.value); render(); }));
const sLW=document.getElementById('sLW'),vLW=document.getElementById('vLW');
sLW.addEventListener('input', e => { S.lw=parseFloat(e.target.value); vLW.textContent=e.target.value; render(); });
document.querySelectorAll('input[name="mk"]').forEach(el =>
  el.addEventListener('change', e => { S.mk=e.target.value; render(); }));
const sMS=document.getElementById('sMS'),vMS=document.getElementById('vMS');
sMS.addEventListener('input', e => { S.ms=parseFloat(e.target.value); vMS.textContent=e.target.value; render(); });
document.querySelectorAll('input[name="grid"]').forEach(el =>
  el.addEventListener('change', e => { S.grid=e.target.value; render(); }));
document.querySelectorAll('.tab').forEach(btn =>
  btn.addEventListener('click', e => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active'); S.tab=e.target.dataset.tab; render();
  }));
[['sFT','vFT','fontTitle'],['sFL','vFL','fontLabel'],['sFTk','vFTk','fontTick']].forEach(([sid,vid,key]) => {
  const sl=document.getElementById(sid),vl=document.getElementById(vid);
  sl.addEventListener('input', e => { S[key]=parseInt(e.target.value); vl.textContent=e.target.value; render(); });
});
document.getElementById('themeBtn').addEventListener('click', () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; render();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!document.documentElement.dataset.theme) render();
});

document.documentElement.dataset.theme = 'light';
render();
</script>
